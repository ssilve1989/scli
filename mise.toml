[tools]
rust = "stable"

[tasks.test]
run = "cargo test"
description = "Run Rust tests"

[tasks.format]
run = "cargo fmt"
description = "Format Rust code"

[tasks.lint]
run = "cargo clippy -- -D warnings"
description = "Lint Rust code"

[tasks.build]
run = "cargo build --release"
description = "Build release binary"
